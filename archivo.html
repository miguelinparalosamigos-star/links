<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archivo · Psicolinks</title>
<meta name="description" content="Todos los artículos publicados en Psicolinks, de más reciente a más antiguo.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Psicolinks">
<meta property="og:title" content="Archivo · Psicolinks">
<meta property="og:description" content="Todos los artículos publicados en Psicolinks, de más reciente a más antiguo.">
<meta property="og:url" content="https://psicolinks.example/archivo.html">
<meta property="og:image" content="https://psicolinks.example/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://psicolinks.example/archivo.html">
<meta name="theme-color" content="#EEEDE6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EEEDE6; --surface: #FFFFFF; --ink: #211F2E; --ink-soft: #625C70;
    --border: #DDD7CB; --accent: #4A3B78; --stamp: #B5541D;
    --font-display: 'Lora', Georgia, serif;
    --font-body: 'Work Sans', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .site-header { border-bottom: 1px solid var(--border); padding: 2rem 1.5rem 1.5rem; text-align: center; }
  .logo { font-family: var(--font-display); font-weight: 700; font-size: 1.7rem; color: var(--ink); text-decoration: none; }
  .logo em { color: var(--accent); font-style: normal; }

  main { max-width: 640px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  .back-link { font-size: 0.9rem; color: var(--ink-soft); text-decoration: none; display: inline-block; margin-bottom: 1rem; }
  .back-link:hover { text-decoration: underline; }
  h1 { font-family: var(--font-display); font-size: 1.6rem; margin: 0 0 1.5rem; }

  .lista-archivo { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .item-archivo {
    display: flex; justify-content: space-between; align-items: baseline; gap: 1rem;
    padding: 0.9rem 1.2rem; text-decoration: none; color: var(--ink);
  }
  .item-archivo:not(:last-child) { border-bottom: 1px solid var(--border); }
  .item-archivo:hover .item-titulo { color: var(--accent); text-decoration: underline; }
  .item-titulo { font-weight: 600; font-size: 0.95rem; }
  .item-fecha { font-size: 0.8rem; color: var(--ink-soft); white-space: nowrap; font-family: monospace; }

  .status-msg { text-align: center; color: var(--ink-soft); padding: 3rem 1rem; }

  .site-footer { border-top: 1px solid var(--border); padding: 1.75rem 1.5rem 2.5rem; text-align: center; color: var(--ink-soft); font-size: 0.82rem; }
  .otras-webs-titulo { font-family: var(--font-display); font-size: 0.8rem; font-weight: 600; color: var(--ink); text-transform: uppercase; letter-spacing: 0.07em; margin: 0 0 0.8rem; }
  .otras-webs-lista { display: flex; flex-wrap: wrap; gap: 0.7rem; justify-content: center; margin-bottom: 1.2rem; }
  .sitio-amigo {
    display: flex; align-items: center; gap: 0.6rem; text-decoration: none;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 0.65rem 1rem; transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .sitio-amigo:hover { border-color: var(--accent); transform: translateY(-1px); }
  .sitio-amigo-icono { width: 28px; height: auto; flex-shrink: 0; }
  .sitio-amigo-texto { display: flex; flex-direction: column; text-align: left; }
  .sitio-amigo-nombre { font-family: var(--font-display); font-style: italic; font-weight: 600; font-size: 0.98rem; color: var(--ink); }
  .sitio-amigo-desc { font-size: 0.72rem; color: var(--ink-soft); }
</style>
</head>
<body>

<header class="site-header"><a href="/" class="logo">psico<em>links</em></a></header>

<main>
  <a href="/" class="back-link">← Volver a Psicolinks</a>
  <h1>Todos los artículos</h1>
  <div id="lista" class="lista-archivo">
    <p class="status-msg">Cargando…</p>
  </div>
</main>

<footer class="site-footer">
  <p class="otras-webs-titulo">Otras webs</p>
  <div class="otras-webs-lista">
    <a class="sitio-amigo" href="https://concienciaconductual.com" target="_blank" rel="noopener">
      <svg class="sitio-amigo-icono" viewBox="0 0 42 22" fill="none" stroke="#8C3B4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1,12 L5,4 L8,19 L12,3 L15,13 C17.5,8 20.5,8 23,12 C24.5,14.5 27,14.5 28.5,12 C30,9.5 32,9.5 34,12 L41,12"/></svg>
      <span class="sitio-amigo-texto">
        <span class="sitio-amigo-nombre">Conciencia Conductual</span>
        <span class="sitio-amigo-desc">Consulta de psicología con Miguel Martínez</span>
      </span>
    </a>
  </div>
  <p>© 2026 Psicolinks</p>
</footer>

<script>
  fetch('/.netlify/functions/list-posts')
    .then((r) => (r.ok ? r.json() : null))
    .then((data) => {
      const lista = document.getElementById('lista');
      if (!data || !data.posts || data.posts.length === 0) {
        lista.innerHTML = '<p class="status-msg">Todavía no hay artículos publicados.</p>';
        return;
      }
      lista.innerHTML = data.posts.map((p) => {
        const fecha = (p.fechaPublicacion || p.fecha || '').slice(0, 10);
        return `
          <a class="item-archivo" href="post.html?id=${p.id}">
            <span class="item-titulo">${p.titulo}</span>
            <span class="item-fecha">${fecha}</span>
          </a>
        `;
      }).join('');
    })
    .catch(() => {
      document.getElementById('lista').innerHTML = '<p class="status-msg">No se ha podido cargar el archivo.</p>';
    });
</script>
</body>
</html>
