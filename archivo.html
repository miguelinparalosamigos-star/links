<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archivo · Psicolinks</title>
<meta name="description" content="Todos los artículos publicados en Psicolinks, de más reciente a más antiguo.">
<meta name="theme-color" content="#EEEDE6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EEEDE6; --surface: #FFFFFF; --ink: #211F2E; --ink-soft: #625C70;
    --border: #DDD7CB; --accent: #4A3B78; --stamp: #B5541D;
    --font-display: 'Lora', Georgia, serif;
    --font-body: 'Work Sans', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .site-header { border-bottom: 1px solid var(--border); padding: 2rem 1.5rem 1.5rem; text-align: center; }
  .logo { font-family: var(--font-display); font-weight: 700; font-size: 1.7rem; color: var(--ink); text-decoration: none; }
  .logo em { color: var(--accent); font-style: normal; }

  main { max-width: 640px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  .back-link { font-size: 0.9rem; color: var(--ink-soft); text-decoration: none; display: inline-block; margin-bottom: 1rem; }
  .back-link:hover { text-decoration: underline; }
  h1 { font-family: var(--font-display); font-size: 1.6rem; margin: 0 0 1.5rem; }

  .lista-archivo { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .item-archivo {
    display: flex; justify-content: space-between; align-items: baseline; gap: 1rem;
    padding: 0.9rem 1.2rem; text-decoration: none; color: var(--ink);
  }
  .item-archivo:not(:last-child) { border-bottom: 1px solid var(--border); }
  .item-archivo:hover .item-titulo { color: var(--accent); text-decoration: underline; }
  .item-titulo { font-weight: 600; font-size: 0.95rem; }
  .item-fecha { font-size: 0.8rem; color: var(--ink-soft); white-space: nowrap; font-family: monospace; }

  .status-msg { text-align: center; color: var(--ink-soft); padding: 3rem 1rem; }
</style>
</head>
<body>

<header class="site-header"><a href="/" class="logo">psico<em>links</em></a></header>

<main>
  <a href="/" class="back-link">← Volver a Psicolinks</a>
  <h1>Todos los artículos</h1>
  <div id="lista" class="lista-archivo">
    <p class="status-msg">Cargando…</p>
  </div>
</main>

<script>
  fetch('/.netlify/functions/list-posts')
    .then((r) => (r.ok ? r.json() : null))
    .then((data) => {
      const lista = document.getElementById('lista');
      if (!data || !data.posts || data.posts.length === 0) {
        lista.innerHTML = '<p class="status-msg">Todavía no hay artículos publicados.</p>';
        return;
      }
      lista.innerHTML = data.posts.map((p) => {
        const fecha = (p.fechaPublicacion || p.fecha || '').slice(0, 10);
        return `
          <a class="item-archivo" href="post.html?id=${p.id}">
            <span class="item-titulo">${p.titulo}</span>
            <span class="item-fecha">${fecha}</span>
          </a>
        `;
      }).join('');
    })
    .catch(() => {
      document.getElementById('lista').innerHTML = '<p class="status-msg">No se ha podido cargar el archivo.</p>';
    });
</script>
</body>
</html>
