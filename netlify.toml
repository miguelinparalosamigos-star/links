[build]
  publish = "."
  functions = "netlify/functions"

[[plugins]]
  package = "@netlify/plugin-functions-install-core"

# fetch-studies.js se activa sola cada dia laborable (lunes a viernes) a las
# 07:00 UTC (ver "schedule" dentro del propio fichero). No hace falta configurar
# nada aqui para eso.

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200

# Páginas de artículo con URL limpia y renderizadas en el servidor (para SEO):
# /articulo/titulo-legible/<id>  ->  función articulo (le pasa la ruta en "ruta").
[[redirects]]
  from = "/articulo/*"
  to = "/.netlify/functions/articulo?ruta=:splat"
  status = 200
