[build]
  publish = "."
  functions = "netlify/functions"

[[plugins]]
  package = "@netlify/plugin-functions-install-core"

# fetch-studies.js se activa sola cada dia laborable (lunes a viernes) a las
# 07:00 UTC (ver "schedule" dentro del propio fichero). No hace falta configurar
# nada aqui para eso.

# ---------------------------------------------------------------------------
# Tres paginas eran la misma lista de doscientas guias: guias.html (buscador y
# filtros), temas.html (por temas) e indice.html (de la A a la Z). Y las tres
# se enlazaban entre si, asi que quien entraba a una tenia delante las otras
# dos. Se queda temas.html, que ademas se pliega y no crece al anadir guias, y
# se le metio dentro el buscador.
#
# El 301 (no 302) es importante: le dice a Google que la mudanza es definitiva
# y le pasa a temas.html las posiciones que tuvieran las otras dos. Sin esto,
# se perderian. "force" hace falta porque los ficheros siguen existiendo en el
# repositorio: si algun dia hay que dar marcha atras, basta con quitar estas
# dos reglas.
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/guias.html"
  to = "/temas.html"
  status = 301
  force = true

[[redirects]]
  from = "/indice.html"
  to = "/temas.html"
  status = 301
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200

# Feed RSS de los articulos diarios, para lectores tipo Feedly y agregadores.
[[redirects]]
  from = "/feed.xml"
  to = "/.netlify/functions/feed"
  status = 200

# Páginas de artículo con URL limpia y renderizadas en el servidor (para SEO):
# /articulo/titulo-legible/<id>  ->  función articulo (le pasa la ruta en "ruta").
# Archivo de artículos renderizado en el servidor. La version estatica
# archivo.html pinta la lista con JavaScript, asi que en el HTML que ve
# Google no habia ni un enlace a los articulos: cientos de paginas
# dependian solo del sitemap. Con esto los enlaces van dentro del HTML.
# "force" es necesario porque existe el fichero estatico con ese nombre
# (se queda como respaldo: si se quita esta regla, vuelve a servirse el).
[[redirects]]
  from = "/archivo.html"
  to = "/.netlify/functions/archivo"
  status = 200
  force = true

[[redirects]]
  from = "/articulo/*"
  to = "/.netlify/functions/articulo?ruta=:splat"
  status = 200

# ---------------------------------------------------------------------------
# Cache de los ficheros que nunca cambian. Sin esto, cada visitante que vuelve
# se vuelve a descargar los PDF y las imagenes enteros, y eso es ancho de banda
# de Netlify que se gasta para nada. Con esto, el navegador los guarda y la
# segunda vez no pide nada. El HTML NO se cachea aqui a proposito: si lo hiciera
# la portada tardaria en actualizarse tras cada despliegue.
# ---------------------------------------------------------------------------

[[headers]]
  for = "/descargas/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"
