[build]
  publish = "."
  functions = "netlify/functions"

[[plugins]]
  package = "@netlify/plugin-functions-install-core"

# fetch-studies.js se activa sola cada dia laborable (lunes a viernes) a las
# 07:00 UTC (ver "schedule" dentro del propio fichero). No hace falta configurar
# nada aqui para eso.

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200

# Feed RSS de los articulos diarios, para lectores tipo Feedly y agregadores.
[[redirects]]
  from = "/feed.xml"
  to = "/.netlify/functions/feed"
  status = 200

# Páginas de artículo con URL limpia y renderizadas en el servidor (para SEO):
# /articulo/titulo-legible/<id>  ->  función articulo (le pasa la ruta en "ruta").
[[redirects]]
  from = "/articulo/*"
  to = "/.netlify/functions/articulo?ruta=:splat"
  status = 200

# ---------------------------------------------------------------------------
# Cache de los ficheros que nunca cambian. Sin esto, cada visitante que vuelve
# se vuelve a descargar los PDF y las imagenes enteros, y eso es ancho de banda
# de Netlify que se gasta para nada. Con esto, el navegador los guarda y la
# segunda vez no pide nada. El HTML NO se cachea aqui a proposito: si lo hiciera
# la portada tardaria en actualizarse tras cada despliegue.
# ---------------------------------------------------------------------------

[[headers]]
  for = "/descargas/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"
