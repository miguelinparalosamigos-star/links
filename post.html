<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Psicolinks</title>
<meta name="description" id="meta-description" content="Curiosidades de psicología basadas en estudios científicos reales, explicadas en español claro, con la fuente siempre a la vista.">
<meta property="og:type" content="article">
<meta property="og:site_name" content="Psicolinks">
<meta property="og:title" id="og-title" content="Psicolinks">
<meta property="og:description" id="og-description" content="Curiosidades de psicología basadas en estudios científicos reales.">
<meta property="og:url" id="og-url" content="https://psicolinks.example/post.html">
<meta property="og:image" content="https://psicolinks.example/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" id="link-canonical" href="https://psicolinks.example/post.html">
<meta name="theme-color" content="#EEEDE6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EEEDE6; --surface: #FFFFFF; --ink: #211F2E; --ink-soft: #625C70;
    --border: #DDD7CB; --accent: #4A3B78; --stamp: #B5541D;
    --font-display: 'Lora', Georgia, serif;
    --font-body: 'Work Sans', system-ui, sans-serif;
    --font-mono: 'Space Mono', 'Courier New', monospace;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .site-header { border-bottom: 1px solid var(--border); padding: 2rem 1.5rem 1.5rem; text-align: center; }
  .logo { font-family: var(--font-display); font-weight: 700; font-size: 1.7rem; color: var(--ink); text-decoration: none; }
  .logo em { color: var(--accent); font-style: normal; }

  main { max-width: 640px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  .back-link { font-size: 0.9rem; color: var(--ink-soft); text-decoration: none; display: inline-block; margin-bottom: 1.5rem; }
  .back-link:hover { text-decoration: underline; }

  .stamp {
    display: inline-flex; align-items: center; gap: 0.4rem; font-family: var(--font-mono);
    font-size: 0.72rem; color: var(--stamp); border: 1.3px dashed var(--stamp); border-radius: 999px;
    padding: 0.25rem 0.7rem; transform: rotate(-1.2deg); margin-bottom: 1rem;
  }
  .post-title { font-family: var(--font-display); font-size: 1.75rem; font-weight: 700; line-height: 1.28; margin: 0 0 1.2rem; }

  .post-body { font-size: 1.05rem; line-height: 1.7; color: var(--ink); }
  .post-body p { margin: 0 0 1.3rem; }

  .source-box {
    margin-top: 2rem; padding: 1.3rem 1.4rem; background: var(--surface);
    border: 1px solid var(--border); border-radius: 12px;
  }
  .source-box p { margin: 0 0 0.8rem; color: var(--ink-soft); font-size: 0.9rem; }
  .btn-source {
    display: inline-block; background: var(--ink); color: var(--paper); text-decoration: none;
    font-weight: 600; padding: 0.65rem 1.1rem; border-radius: 9px; font-size: 0.92rem;
  }
  .btn-source:hover { background: var(--accent); }


  .libros-box {
    margin-top: 1.1rem; padding: 1.3rem 1.4rem; background: var(--surface);
    border: 1px solid var(--border); border-radius: 12px;
  }
  .libros-box p { margin: 0 0 0.9rem; color: var(--ink-soft); font-size: 0.9rem; }
  .libros-lista { display: flex; flex-direction: column; gap: 0.6rem; }
  .libro-link {
    display: flex; align-items: center; gap: 0.6rem; text-decoration: none;
    color: var(--ink); font-weight: 600; font-size: 0.95rem; padding: 0.7rem 0.9rem;
    border: 1px solid var(--border); border-radius: 9px; transition: border-color 0.15s, background 0.15s;
  }
  .libro-link:hover { border-color: var(--accent); background: var(--paper); }
  .libros-box p.libros-disclosure { font-size: 0.55rem; color: var(--ink-soft); margin: 0.5rem 0 0; opacity: 0.6; }

  .status-msg { text-align: center; color: var(--ink-soft); padding: 3rem 1rem; }

  .site-footer { border-top: 1px solid var(--border); padding: 1.75rem 1.5rem 2.5rem; text-align: center; color: var(--ink-soft); font-size: 0.82rem; }
  .otras-webs-titulo { font-family: var(--font-display); font-size: 0.8rem; font-weight: 600; color: var(--ink); text-transform: uppercase; letter-spacing: 0.07em; margin: 0 0 0.8rem; }
  .otras-webs-lista { display: flex; flex-wrap: wrap; gap: 0.7rem; justify-content: center; margin-bottom: 1.2rem; }
  .sitio-amigo {
    display: flex; align-items: center; gap: 0.6rem; text-decoration: none;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 0.65rem 1rem; transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .sitio-amigo:hover { border-color: var(--accent); transform: translateY(-1px); }
  .sitio-amigo-icono { width: 28px; height: auto; flex-shrink: 0; }
  .sitio-amigo-texto { display: flex; flex-direction: column; text-align: left; }
  .sitio-amigo-nombre { font-family: var(--font-display); font-style: italic; font-weight: 600; font-size: 0.98rem; color: var(--ink); }
  .sitio-amigo-desc { font-size: 0.72rem; color: var(--ink-soft); }
</style>
</head>
<body>

<header class="site-header"><a href="/" class="logo">psico<em>links</em></a></header>

<main id="post-container">
  <p class="status-msg">Cargando…</p>
</main>

<footer class="site-footer">
  <p class="otras-webs-titulo">Otras webs</p>
  <div class="otras-webs-lista">
    <a class="sitio-amigo" href="https://concienciaconductual.com" target="_blank" rel="noopener" onclick="registrarClic('concienciaconductual')">
      <svg class="sitio-amigo-icono" viewBox="0 0 42 22" fill="none" stroke="#8C3B4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1,12 L5,4 L8,19 L12,3 L15,13 C17.5,8 20.5,8 23,12 C24.5,14.5 27,14.5 28.5,12 C30,9.5 32,9.5 34,12 L41,12"/></svg>
      <span class="sitio-amigo-texto">
        <span class="sitio-amigo-nombre">Conciencia Conductual</span>
        <span class="sitio-amigo-desc">Consulta de psicología con Miguel Martínez</span>
      </span>
    </a>
  </div>
  <p>© 2026 Psicolinks</p>
</footer>

<script>
  const EJEMPLOS = {
    'ejemplo-1': {
      fuente: 'Journal of Sleep Research · 2012',
      titulo: 'Dormir no siempre "resetea" una emoción fuerte: a veces la conserva',
      parrafos: [
        'Investigadores mostraron a un grupo de participantes imágenes emocionalmente negativas y neutras, y midieron su reacción emocional 12 horas después. A un grupo le tocó pasar esas 12 horas despierto, y al otro dormir durante ese tiempo.',
        'En el grupo que se quedó despierto, la reacción emocional a las imágenes negativas se redujo notablemente con el paso de las horas. En el grupo que durmió, en cambio, esa reacción se mantuvo casi igual de intensa — y cuanto más tiempo pasaban en fase de sueño REM, mejor se conservaba esa reacción.',
        'Los autores lo interpretan como que dormir ayuda a consolidar el recuerdo emocional de lo vivido, en lugar de simplemente "diluirlo" con el paso del tiempo, como sí ocurre estando despierto.',
      ],
      url: 'https://pubmed.ncbi.nlm.nih.gov/22262901/',
      urlLabel: 'Ver el estudio original en PubMed (en inglés)',
    },
    'ejemplo-2': {
      fuente: 'Journal of Research in Personality · 2008',
      titulo: 'Escribir sobre lo que te preocupa protege más a quien más le da vueltas',
      parrafos: [
        '69 estudiantes de primer curso fueron evaluados por su tendencia a rumiar (darle vueltas de forma repetitiva a pensamientos negativos) y por sus síntomas depresivos, y después asignados al azar a escribir de forma expresiva sobre sus emociones o a una tarea de escritura neutra.',
        'A los 2, 4 y 6 meses, quienes tenían mayor tendencia a rumiar y habían hecho la escritura expresiva mostraban síntomas depresivos claramente menores que quienes hicieron la escritura neutra. En quienes rumiaban poco de partida, apenas hubo diferencia entre los dos grupos.',
        'Es decir: el beneficio de esta escritura breve no fue igual para todo el mundo — fue mayor precisamente para quienes más lo necesitaban.',
      ],
      url: 'https://pubmed.ncbi.nlm.nih.gov/18410204/',
      urlLabel: 'Ver el estudio original en PubMed (en inglés)',
    },
    'ejemplo-3': {
      fuente: 'Journal of Personality and Social Psychology · 2008',
      titulo: 'Pedimos ayuda pensando que nos dirán que no, y casi nunca pasa',
      parrafos: [
        'En una serie de seis estudios, con peticiones de ayuda tanto en laboratorio como en situaciones reales (pedir usar un móvil, rellenar una encuesta, acompañar a alguien), los investigadores encontraron un patrón consistente: quienes pedían ayuda predecían que serían rechazados con mucha más frecuencia de la que realmente ocurría.',
        'En concreto, las personas subestimaron la disposición real de los demás a ayudar hasta en un 50%.',
        'Según los autores, esto ocurre porque quien pide ayuda se centra en lo incómodo que puede ser para el otro decir que sí, mientras que quien podría ayudar valora más el coste social de decir que no — y ese coste pesa más de lo que el que pide imagina.',
      ],
      url: 'https://doi.org/10.1037/0022-3514.95.1.128',
      urlLabel: 'Ver el estudio original (DOI, en inglés)',
    },
  };

  // ---------------------------------------------------------------
  // Catálogo de libros recomendados (con enlace de afiliado de Amazon)
  // ---------------------------------------------------------------
  // Para añadir un libro nuevo, ya no hace falta que generes tú el enlace
  // de "compartir" en Amazon: basta con la URL del producto (o el ASIN,
  // el código que va después de /dp/ en la URL) más "?tag=conciencia07-21"
  // al final — así es como Amazon sabe que la venta es tuya. Solo dime el
  // título del libro y de qué trata, y yo te preparo el bloque.
  // Las "palabrasClave" son las que, si aparecen en el título o el texto
  // del artículo, hacen que ESE libro se recomiende para ESE artículo —
  // pon varias variantes (singular, plural, sinónimos).
  const CATALOGO_LIBROS = [
    {
      id: 'superregla',
      titulo: 'La superregla',
      emoji: '📖',
      url: 'https://amzn.to/3TLnBZL',
      palabrasClave: [
        'ansiedad', 'miedo', 'evitación', 'evitar', 'pánico', 'fobia',
        'estrés', 'preocupación', 'preocupa', 'emoción', 'emociones',
        'malestar', 'psicofármaco', 'angustia', 'nervios', 'nerviosismo',
      ],
    },
    {
      id: 'esqueyosoyasi',
      titulo: 'Es que yo soy así',
      emoji: '📖',
      // Enlace construido con tu ASIN + tu ID de afiliado (revisa que abra
      // bien tu libro — si no, dime el enlace correcto y lo cambio).
      url: 'https://www.amazon.es/dp/B0GSJYQNHD?tag=conciencia07-21',
      palabrasClave: [
        'personalidad', 'identidad', 'carácter', 'patrón', 'patrones',
        'hábito', 'hábitos', 'costumbre', 'rutina', 'autoconcepto',
        'creencia', 'creencias', 'diagnóstico', 'etiqueta', 'autoestima',
        'inseguridad',
      ],
    },
    {
      id: 'habitos-sueno',
      titulo: 'Los hábitos del sueño',
      emoji: '📖',
      url: 'https://www.amazon.es/dp/8410467216?tag=conciencia07-21',
      palabrasClave: [
        'sueño', 'dormir', 'insomnio', 'descanso', 'siesta', 'despertar',
        'dormido', 'duerme', 'duermen', 'rem',
      ],
    },
    {
      id: 'ciencia-memoria',
      titulo: 'La ciencia de la memoria',
      emoji: '📖',
      url: 'https://www.amazon.es/dp/8413612276?tag=conciencia07-21',
      palabrasClave: [
        'memoria', 'recordar', 'recuerdo', 'recuerdos', 'olvido', 'olvidar',
        'aprendizaje', 'aprender', 'aprende',
      ],
    },
    {
      id: 'amar-o-depender',
      titulo: '¿Amar o depender?',
      emoji: '📖',
      url: 'https://www.amazon.es/dp/8408126245?tag=conciencia07-21',
      palabrasClave: [
        'pareja', 'relación', 'relaciones', 'apego', 'dependencia emocional',
        'amor', 'vínculo', 'vínculos', 'vinculo', 'vinculos',
      ],
    },
  ];

  // Convierte el resumen en párrafos de verdad. fetch-studies.js suele
  // separar los párrafos con una línea en blanco; si no encuentra
  // ninguna, prueba con saltos de línea simples.
  function dividirEnParrafos(texto) {
    if (!texto) return [];
    let partes = texto.split(/\n\s*\n+/).map((t) => t.trim()).filter(Boolean);
    if (partes.length <= 1) {
      partes = texto.split(/\n+/).map((t) => t.trim()).filter(Boolean);
    }
    return partes.length > 0 ? partes : [texto.trim()];
  }

  // Elige los libros del catálogo cuyas palabras clave aparecen en el
  // título/texto del artículo. Si ninguno encaja, reparte entre los que hay
  // (barajados) en vez de mostrar siempre el mismo primero.
  function barajar(lista) {
    const copia = lista.slice();
    for (let i = copia.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copia[i], copia[j]] = [copia[j], copia[i]];
    }
    return copia;
  }

  function elegirLibrosRelevantes(datos, cantidad) {
    const texto = (
      (datos.titulo || '') + ' ' +
      (datos.parrafos || []).join(' ') + ' ' +
      (datos.fuente || '')
    ).toLowerCase();

    const puntuados = barajar(CATALOGO_LIBROS).map((libro) => {
      const puntuacion = libro.palabrasClave.reduce(
        (total, palabra) => total + (texto.includes(palabra.toLowerCase()) ? 1 : 0),
        0
      );
      return { libro, puntuacion };
    });

    // Barajamos antes de puntuar, así que en caso de empate (incluido el caso
    // de que nadie encaje, todos a 0) el orden ya viene mezclado en vez de
    // ser siempre el mismo.
    puntuados.sort((a, b) => b.puntuacion - a.puntuacion);
    const conCoincidencia = puntuados.filter((p) => p.puntuacion > 0);
    const elegidos = conCoincidencia.length > 0 ? conCoincidencia : puntuados;

    return elegidos.slice(0, cantidad).map((p) => p.libro);
  }

  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const container = document.getElementById('post-container');

  function render(data) {
    const descripcion = (data.teaser || data.parrafos[0] || '').slice(0, 155);
    const urlActual = window.location.href;
    document.title = `${data.titulo} · Psicolinks`;
    document.getElementById('meta-description').setAttribute('content', descripcion);
    document.getElementById('og-title').setAttribute('content', data.titulo);
    document.getElementById('og-description').setAttribute('content', descripcion);
    document.getElementById('og-url').setAttribute('content', urlActual);
    document.getElementById('link-canonical').setAttribute('href', urlActual);

    const jsonLd = document.createElement('script');
    jsonLd.type = 'application/ld+json';
    jsonLd.textContent = JSON.stringify({
      '@context': 'https://schema.org',
      '@type': 'BlogPosting',
      headline: data.titulo,
      description: descripcion,
      image: 'https://psicolinks.example/og-image.jpg',
      url: urlActual,
      inLanguage: 'es',
      isAccessibleForFree: true,
      publisher: { '@type': 'Organization', name: 'Psicolinks' },
      mainEntityOfPage: { '@type': 'WebPage', '@id': urlActual },
    });
    document.head.appendChild(jsonLd);

    const librosElegidos = elegirLibrosRelevantes(data, 2);
    const librosHtml = librosElegidos.map((libro) => `
          <a class="libro-link" href="${libro.url}" target="_blank" rel="noopener sponsored" onclick="registrarClic('libro-${libro.id}')">${libro.emoji} ${libro.titulo} →</a>`
    ).join('');

    container.innerHTML = `
      <a href="/" class="back-link">← Volver a Psicolinks</a>
      <h1 class="post-title">${data.titulo}</h1>
      <span class="stamp">📎 ${data.fuente}</span>
      <div class="post-body">${data.parrafos.map((p) => `<p>${p}</p>`).join('')}</div>
      <div class="source-box">
        <p>Este resumen se basa en un estudio científico real. Si quieres profundizar, el original está aquí:</p>
        <a class="btn-source" href="${data.url}" target="_blank" rel="noopener">${data.urlLabel} →</a>
      </div>
      <div class="libros-box">
        <p>Si te interesa este tema, estos libros pueden ayudarte a profundizar:</p>
        <div class="libros-lista">${librosHtml}
        </div>
        <p class="libros-disclosure">Enlaces de afiliado — puede generar comisión, sin coste para ti.</p>
      </div>
    `;
  }

  function registrarClic(nombre) {
    fetch('/.netlify/functions/track-view', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ clic: nombre }),
    }).catch(() => {});
  }

  if (id && EJEMPLOS[id]) {
    render(EJEMPLOS[id]);
  } else if (id) {
    fetch(`/.netlify/functions/get-post?id=${encodeURIComponent(id)}`)
      .then((r) => (r.ok ? r.json() : null))
      .then((data) => {
        if (!data || !data.post) {
          container.innerHTML = '<p class="status-msg">No se ha encontrado esta publicación.</p>';
          return;
        }
        const p = data.post;
        render({
          fuente: p.fuente,
          titulo: p.titulo,
          teaser: p.teaser,
          parrafos: dividirEnParrafos(p.resumen),
          url: p.pmid ? `https://pubmed.ncbi.nlm.nih.gov/${p.pmid}/` : '#',
          urlLabel: 'Ver el estudio original en PubMed (en inglés)',
        });
        fetch('/.netlify/functions/track-view', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pagina: 'post', id }),
        }).catch(() => {});
      })
      .catch(() => {
        container.innerHTML = '<p class="status-msg">No se ha podido cargar esta publicación.</p>';
      });
  } else {
    container.innerHTML = '<p class="status-msg">Publicación no especificada.</p>';
  }
</script>
</body>
</html>
