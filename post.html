  // Mismo slug que la función "articulo", el sitemap y la portada: sirve para
  // apuntar el canonical y los enlaces a la URL limpia /articulo/…
  function slugify(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,80) || 'articulo'; }

  // Convierte el resumen en párrafos de verdad. fetch-studies.js suele
  // separar los párrafos con una línea en blanco; si no encuentra
  // ninguna, prueba con saltos de línea simples.
  function dividirEnParrafos(texto) {
    if (!texto) return [];
    let partes = texto.split(/\n\s*\n+/).map((t) => t.trim()).filter(Boolean);
    if (partes.length <= 1) {
      partes = texto.split(/\n+/).map((t) => t.trim()).filter(Boolean);
    }
    return partes.length > 0 ? partes : [texto.trim()];
  }

  // Elige los libros del catálogo cuyas palabras clave aparecen en el
  // título/texto del artículo. Si ninguno encaja, reparte entre los que hay
  // (barajados) en vez de mostrar siempre el mismo primero.
  function barajar(lista) {
    const copia = lista.slice();
    for (let i = copia.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copia[i], copia[j]] = [copia[j], copia[i]];
    }
    return copia;
  }

  function elegirLibrosRelevantes(datos, cantidad) {
    const tema = (datos.tema || '').toLowerCase().trim();
    const texto = (
      (datos.titulo || '') + ' ' +
      (datos.parrafos || []).join(' ') + ' ' +
      (datos.fuente || '')
    ).toLowerCase();

    // Barajamos antes de puntuar para que los empates no salgan siempre igual.
    const puntuados = barajar(CATALOGO_LIBROS).map((libro) => {
      let puntuacion = 0;
      // 1) Coincidencia por TEMA (la vía fiable): pesa mucho.
      if (tema && Array.isArray(libro.temas) && libro.temas.includes(tema)) {
        puntuacion += 10;
      }
      // 2) Coincidencia por palabras clave (respaldo para posts sin tema).
      puntuacion += libro.palabrasClave.reduce(
        (total, palabra) => total + (texto.includes(palabra.toLowerCase()) ? 1 : 0),
        0
      );
      return { libro, puntuacion };
    });
    puntuados.sort((a, b) => b.puntuacion - a.puntuacion);

    const relevantes = puntuados.filter((p) => p.puntuacion > 0).map((p) => p.libro);
    if (relevantes.length >= cantidad) return relevantes.slice(0, cantidad);

    // Si no hay libros que encajen de verdad, se completa con los "generales"
    // (los libros propios), NUNCA con uno al azar sin relación con el tema.
    const generales = barajar(
      CATALOGO_LIBROS.filter((l) => l.general && !relevantes.includes(l))
    );
    return [...relevantes, ...generales].slice(0, cantidad);
  }

  // Quita acentos y signos para comparar palabras sin que un "está" y un
  // "esta" cuenten como distintas.
  function normalizar(texto) {
    return (texto || '')
      .toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9\s]/g, ' ');
  }

  // Palabras demasiado genéricas en textos de divulgación científica como
  // para servir de pista de "de qué trata" un artículo.
  const PALABRAS_VACIAS_RELACIONADOS = new Set([
    'para', 'como', 'pero', 'esto', 'esta', 'estos', 'estas', 'entre', 'sobre',
    'desde', 'hasta', 'donde', 'cuando', 'porque', 'tambien', 'mientras',
    'despues', 'antes', 'mismo', 'misma', 'mucho', 'mucha', 'muchos', 'muchas',
    'poco', 'pocos', 'tiene', 'tienen', 'fueron', 'estudio', 'estudios',
    'investigadores', 'participantes', 'personas', 'resultado', 'resultados',
  ]);

  function palabrasClaveDe(texto) {
    return normalizar(texto)
      .split(/\s+/)
      .filter((p) => p.length > 4 && !PALABRAS_VACIAS_RELACIONADOS.has(p));
  }

  // Puntúa cada candidato por cuántas palabras clave comparte con el
  // artículo actual. Sin diccionario de temas: solo solapamiento de texto.
  function elegirRelacionados(actual, candidatos, cantidad) {
    const palabrasActual = new Set(palabrasClaveDe(
      (actual.titulo || '') + ' ' + (actual.parrafos || []).join(' ')
    ));
    const puntuados = candidatos.map((p) => {
      const palabrasOtro = palabrasClaveDe((p.titulo || '') + ' ' + (p.teaser || ''));
      let puntuacion = 0;
      palabrasOtro.forEach((palabra) => { if (palabrasActual.has(palabra)) puntuacion++; });
      return { p, puntuacion };
    });
    // A igual puntuación (incluido 0-0, cuando nada encaja), se conserva el
    // orden de list-posts, que ya viene del más reciente al más antiguo.
    puntuados.sort((a, b) => b.puntuacion - a.puntuacion);
    return puntuados.slice(0, cantidad).map((x) => x.p);
  }

  // No bloquea el resto de la página: si falla o no hay más artículos, la
  // sección de relacionados simplemente no aparece.
  function cargarRelacionados(data, idActual) {
    fetch('/.netlify/functions/list-posts?limit=30')
      .then((r) => (r.ok ? r.json() : null))
      .then((resp) => {
        const destino = document.getElementById('relacionados-container');
        if (!destino || !resp || !resp.posts) return;
        const candidatos = resp.posts.filter((p) => p.id !== idActual);
        if (candidatos.length === 0) return;
        const elegidos = elegirRelacionados(data, candidatos, 3);
        if (elegidos.length === 0) return;
        destino.innerHTML = `
          <div class="relacionados-box">
            <p class="relacionados-titulo">Sigue leyendo</p>
            <div class="relacionados-lista">
              ${elegidos.map((p) => `<a class="relacionado-link" href="/articulo/${slugify(p.titulo)}/${encodeURIComponent(p.id)}">${p.titulo} →</a>`).join('')}
            </div>
          </div>`;
      })
      .catch(() => {});
  }

  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const container = document.getElementById('post-container');

  function render(data) {
    const descripcion = (data.teaser || data.parrafos[0] || '').slice(0, 155);
    // Para artículos reales, el canonical (y lo que se comparte) apunta a la
    // URL limpia /articulo/… — así Google unifica todo en esa dirección.
    const esReal = id && !EJEMPLOS[id];
    const urlActual = esReal
      ? (location.origin + '/articulo/' + slugify(data.titulo) + '/' + encodeURIComponent(id))
      : window.location.href;
    document.title = `${data.titulo} · Psicolinks`;
    document.getElementById('meta-description').setAttribute('content', descripcion);
    document.getElementById('og-title').setAttribute('content', data.titulo);
    document.getElementById('og-description').setAttribute('content', descripcion);
    document.getElementById('og-url').setAttribute('content', urlActual);
    document.getElementById('link-canonical').setAttribute('href', urlActual);

    const jsonLd = document.createElement('script');
    jsonLd.type = 'application/ld+json';
    jsonLd.textContent = JSON.stringify({
      '@context': 'https://schema.org',
      '@type': 'BlogPosting',
      headline: data.titulo,
      description: descripcion,
      image: 'https://psicolinks.com/og-image.jpg',
      url: urlActual,
      inLanguage: 'es',
      isAccessibleForFree: true,
      publisher: { '@type': 'Organization', name: 'Psicolinks' },
      mainEntityOfPage: { '@type': 'WebPage', '@id': urlActual },
    });
    document.head.appendChild(jsonLd);

    // Breadcrumb: ayuda a que Google entienda dónde encaja este artículo
    // dentro del sitio (portada > artículo), sin cambiar nada visible.
    const breadcrumbLd = document.createElement('script');
    breadcrumbLd.type = 'application/ld+json';
    breadcrumbLd.textContent = JSON.stringify({
      '@context': 'https://schema.org',
      '@type': 'BreadcrumbList',
      itemListElement: [
        { '@type': 'ListItem', position: 1, name: 'Psicolinks', item: 'https://psicolinks.com/' },
        { '@type': 'ListItem', position: 2, name: data.titulo, item: urlActual },
      ],
    });
    document.head.appendChild(breadcrumbLd);

    // Tiempo de lectura estimado (≈200 palabras/min en español).
    const totalPalabras = (data.parrafos || []).join(' ').split(/\s+/).filter(Boolean).length;
    const minutosLectura = Math.max(1, Math.round(totalPalabras / 200));

    // Iconos reconocibles por color + forma (verde+bocadillo = WhatsApp, azul+"f"
    // = Facebook, negro+"X" = X, sobre = email) en vez de solo texto — así se
    // identifica cada red de un vistazo, sin tener que leer las siglas.
    const ICONOS_COMPARTIR = {
      whatsapp: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1.4-4.2A7.9 7.9 0 1 1 9 19.2z"/><path d="M8.2 9.6c.2-.5.5-.5.8-.5h.6c.2 0 .4 0 .6.4.2.5.7 1.6.7 1.8.1.1.1.3 0 .4-.1.2-.2.3-.3.4-.2.2-.3.3-.5.5-.2.2-.3.3-.1.6.2.4.8 1.2 1.7 1.9 1.1 1 2 1.3 2.4 1.5.3.1.5.1.6-.1.2-.2.7-.8.9-1.1.2-.3.4-.2.6-.1.2.1 1.5.7 1.8.9.3.1.5.2.5.3 0 .2 0 .9-.4 1.3-.4.5-1.5.9-2.1.9-.6.1-1 .1-2.5-.5-2.1-.9-3.5-2.9-3.6-3.1-.1-.1-.9-1.2-.9-2.3 0-1.1.6-1.6.8-1.8z" fill="#fff" stroke="none"/></svg>',
      facebook: '<span class="compartir-letra">f</span>',
      x: '<span class="compartir-letra compartir-letra-x">X</span>',
      email: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>',
    };
    const enlacesCompartir = [
      { nombre: 'whatsapp', href: `https://wa.me/?text=${encodeURIComponent(data.titulo + ' — ' + urlActual)}`, etiqueta: 'Compartir por WhatsApp' },
      { nombre: 'facebook', href: `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(urlActual)}`, etiqueta: 'Compartir en Facebook' },
      { nombre: 'x', href: `https://twitter.com/intent/tweet?text=${encodeURIComponent(data.titulo)}&url=${encodeURIComponent(urlActual)}`, etiqueta: 'Compartir en X' },
      { nombre: 'email', href: `mailto:?subject=${encodeURIComponent(data.titulo)}&body=${encodeURIComponent(urlActual)}`, etiqueta: 'Compartir por email' },
    ];
    const compartirHtml = enlacesCompartir.map((e) => `
          <a class="compartir-btn compartir-${e.nombre}" href="${e.href}" target="_blank" rel="noopener" aria-label="${e.etiqueta}" title="${e.etiqueta}" onclick="registrarClic('compartir-${e.nombre}')">${ICONOS_COMPARTIR[e.nombre]}</a>`
    ).join('');

    const librosElegidos = elegirLibrosRelevantes(data, 2);
    const librosHtml = librosElegidos.map((libro) => `
          <a class="libro-link" href="${libro.url}" target="_blank" rel="noopener sponsored" onclick="registrarClic('libro-${libro.id}')">${libro.emoji} ${libro.titulo} →<span class="afiliado-tag">Publicidad. En calidad de Afiliado de Amazon.</span></a>`
    ).join('');

    // El desglose visual es opcional: los artículos que aún no lo traigan
    // (los publicados antes de añadir esto a fetch-studies.js) simplemente
    // no muestran esta caja, sin romper nada.
    const desgloseHtml = !data.desglose ? '' : `
        <div class="desglose">
          <p class="desglose-titulo">Cómo fue el estudio, de un vistazo</p>
          <div class="flujo">
            <div class="flujo-paso">
              <span class="flujo-icono">❓</span>
              <div>
                <span class="flujo-etiqueta">La pregunta</span>
                <p class="flujo-texto">${data.desglose.pregunta}</p>
              </div>
            </div>
            <div class="flujo-flecha">↓</div>
            <div class="flujo-paso">
              <span class="flujo-icono">🧪</span>
              <div>
                <span class="flujo-etiqueta">El método</span>
                <p class="flujo-texto">${data.desglose.metodo}</p>
              </div>
            </div>
            <div class="flujo-flecha">↓</div>
            <div class="flujo-paso flujo-paso-destacado">
              <span class="flujo-icono">💡</span>
              <div>
                <span class="flujo-etiqueta">El hallazgo</span>
                <p class="flujo-texto">${data.desglose.hallazgo}</p>
              </div>
            </div>
            <div class="flujo-flecha">↓</div>
            <div class="flujo-paso">
              <span class="flujo-icono">🧠</span>
              <div>
                <span class="flujo-etiqueta">Por qué pasa</span>
                <p class="flujo-texto">${data.desglose.porQue}</p>
              </div>
            </div>
          </div>
        </div>`;

    container.innerHTML = `
      <a href="/" class="back-link">← Volver a Psicolinks</a>
      <div class="articulo-card">
        <h1 class="post-title">${data.titulo}</h1>
        <div class="meta-fila">
          <span class="stamp">📎 ${data.fuente}</span>
          <span class="tiempo-lectura">🕒 ${minutosLectura} min de lectura</span>
        </div>
        ${desgloseHtml}
        <div class="post-body">${data.parrafos.map((p) => `<p>${p}</p>`).join('')}</div>
        <div class="fuente-original">
          <p>Este resumen se basa en un estudio científico real. Si quieres profundizar, el original está aquí:</p>
          <a class="btn-source" href="${data.url}" target="_blank" rel="noopener">${data.urlLabel} →</a>
          <p style="margin-top:0.9rem; font-size:0.85rem;"><a href="como-leemos-los-estudios.html">¿Qué significa que un estudio sea "significativo"? Cómo leemos los estudios →</a></p>
        </div>
      </div>
      <div class="compartir-box">
        <p>Comparte este artículo:</p>
        <div class="compartir-lista">${compartirHtml}</div>
      </div>
      <div class="libros-box">
        <p>¿Te ha interesado el tema? Estos libros lo desarrollan y te ayudan a llevarlo a tu vida:</p>
        <div class="libros-lista">${librosHtml}
        </div>
        <p class="libros-disclosure">Enlaces de afiliado</p>
      </div>
      <div id="relacionados-container"></div>
    `;

    cargarRelacionados(data, id);
  }

  function registrarClic(nombre) {
    fetch('/.netlify/functions/track-view', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ clic: nombre }),
    }).catch(() => {});
  }

  if (id && EJEMPLOS[id]) {
    render(EJEMPLOS[id]);
  } else if (id) {
    fetch(`/.netlify/functions/get-post?id=${encodeURIComponent(id)}`)
      .then((r) => (r.ok ? r.json() : null))
      .then((data) => {
        if (!data || !data.post) {
          container.innerHTML = '<p class="status-msg">No se ha encontrado esta publicación.</p>';
          return;
        }
        const p = data.post;
        render({
          fuente: p.fuente,
          titulo: p.titulo,
          teaser: p.teaser,
          tema: p.tema,
          parrafos: dividirEnParrafos(p.resumen),
          desglose: p.desglose,
          url: p.pmid ? `https://pubmed.ncbi.nlm.nih.gov/${p.pmid}/` : '#',
          urlLabel: 'Ver el estudio original en PubMed (en inglés)',
        });
        fetch('/.netlify/functions/track-view', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pagina: 'post', id }),
        }).catch(() => {});
      })
      .catch(() => {
        container.innerHTML = '<p class="status-msg">No se ha podido cargar esta publicación.</p>';
      });
  } else {
    container.innerHTML = '<p class="status-msg">Publicación no especificada.</p>';
  }
</script>
